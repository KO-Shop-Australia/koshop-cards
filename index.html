<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>The KO Shop</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f3a">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--navy2:#132a4d;--gold:#c8a248;--gold2:#e8cf8a;--cream:#faf6ec;--ink:#20242c;--mut:#7c7563}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:'EB Garamond',serif}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.banner{width:100%;height:150px;object-fit:cover;border-radius:14px 14px 0 0;display:block;filter:saturate(0.9) brightness(0.85)}
.card{background:linear-gradient(180deg,var(--cream),#f3ecd9);border:1px solid var(--gold);border-top:none;border-radius:0 0 14px 14px;padding:22px;position:relative}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}
.logoRow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logoRow img{height:34px}
h1{margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:.3px}
.role{font-family:'Cormorant Garamond',serif;color:var(--gold);font-weight:600;margin:2px 0 16px;font-size:17px;letter-spacing:.4px}
.row{padding:12px 0;border-top:1px solid rgba(200,162,72,.35);word-break:break-all}
.row a{color:var(--navy);text-decoration:none}.lbl{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:2px}
button{background:var(--navy);color:var(--gold2);border:1px solid var(--gold);border-radius:8px;padding:9px 15px;font:600 14px 'EB Garamond',serif;cursor:pointer;margin:8px 8px 0 0;letter-spacing:.3px}
button.alt{background:transparent;color:var(--navy);border:1px solid var(--navy)}
input,select{width:100%;padding:10px;margin:4px 0 12px;border:1px solid rgba(200,162,72,.5);border-radius:8px;font:16px 'EB Garamond',serif;background:#fff;color:var(--ink)}
label{font-size:12px;color:var(--mut);letter-spacing:.5px}
.tag{background:var(--navy);color:var(--gold2);border-radius:20px;padding:2px 11px;font-size:12px;margin-left:8px;letter-spacing:.3px}
.qr{text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(200,162,72,.35)}
.qr svg{width:170px;height:170px;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--gold)}
.m{padding:10px 0;border-top:1px solid rgba(200,162,72,.3);font-size:14px}.m small{color:var(--mut);display:block}
.note{font-size:12px;color:var(--mut);font-style:italic}
h2{font-family:'Cormorant Garamond',serif;font-size:17px;margin:20px 0 8px;color:var(--navy)}
.ava{width:66px;height:66px;border-radius:50%;object-fit:cover;float:right;margin-left:10px;border:2px solid var(--gold)}
</style></head><body><div class="wrap">
<img class="banner" src="banner.jpg" alt="The KO Shop">
<div class="card" id="app">Loading…</div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,me=null,team=[],pending=[],signup=false,tab='card',photoData=null,editTarget=null;
const link=s=>location.origin+location.pathname+'?c='+s;
function qr(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e){return'';}}
function vcard(c,noPhoto){return['BEGIN:VCARD','VERSION:3.0','FN:'+c.name,'ORG:The KO Shop','TITLE:'+(c.designation||''),'TEL;TYPE=WORK:'+(c.phone||''),'EMAIL;TYPE=WORK:'+(c.email||''),c.address?'ADR;TYPE=WORK:;;'+c.address.replace(/,/g,';'):'',(!noPhoto&&c.photo)?'PHOTO;ENCODING=b;TYPE=JPEG:'+c.photo.split(',')[1]:'','END:VCARD'].filter(Boolean).join('\r\n');}
function saveVcf(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([vcard(me)],{type:'text/vcard'}));a.download='koshop-contact.vcf';a.click();}
function readPhoto(input,cb){
  const f=input.files[0];if(!f)return;
  const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const s=160,cv=document.createElement('canvas');cv.width=s;cv.height=s;
    const ctx=cv.getContext('2d'),m=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    cb(cv.toDataURL('image/jpeg',0.7));
  };img.src=rd.result;};
  rd.readAsDataURL(f);
}
function show(c){return`${c.photo?`<img class="ava" src="${c.photo}">`:''}<div class="logoRow"><img src="logo.png"></div><h1>${esc(c.name)}</h1><div class="role">${esc(c.designation)}${c.type?`<span class="tag">${esc(c.type)}</span>`:''}</div>
<div class="row"><a href="mailto:${esc(c.email)}"><span class="lbl">Work Email</span>${esc(c.email)}</a></div>
<div class="row"><a href="tel:${esc(c.phone)}"><span class="lbl">Phone</span>${esc(c.phone)}</a></div>
${c.address?`<div class="row"><span class="lbl">Address</span>${esc(c.address)}</div>`:''}`;}
async function init(){
  if(!window.CFG){app.textContent='Setup not finished: config.js is missing.';return;}
  sb=supabase.createClient(CFG.url,CFG.key);
  const c=new URLSearchParams(location.search).get('c');
  if(c){const{data}=await sb.rpc('public_card',{s:c});app.innerHTML=data&&data[0]?show(data[0])+`<button onclick="location.href=location.pathname">Open KO Shop Cards</button>`:'Card not found.';return;}
  sb.auth.onAuthStateChange((_e,s)=>{if(!s)loginView();});
  const{data:{session}}=await sb.auth.getSession();
  session?load():loginView();
}
function loginView(){app.innerHTML=`<div class="logoRow"><img src="logo.png"></div><h1 style="font-size:22px">${signup?'Create login':'Log in'}</h1><p class="note">Use your KO Shop work email.</p>
<label>Email</label><input id="em" type="email"><label>Password (min 6 characters)</label><input id="pw" type="password">
<button onclick="auth()">${signup?'Create login':'Log in'}</button><button class="alt" onclick="signup=!signup;loginView()">${signup?'I already have a login':'First time? Create login'}</button><p class="note" id="msg"></p>`;}
async function auth(){
  const a={email:$('em').value.trim(),password:$('pw').value};
  const{error}=signup?await sb.auth.signUp(a):await sb.auth.signInWithPassword(a);
  if(error){$('msg').textContent=error.message;return;}load();
}
async function load(){
  await sb.rpc('claim');
  const{data:{user}}=await sb.auth.getUser();
  const{data}=await sb.from('team').select('*').eq('user_id',user.id).maybeSingle();
  me=data;
  if(!me){
    app.innerHTML=`<h1 style="font-size:22px">Request access</h1><p class="note">Your email (${esc(user.email)}) isn't on the team list yet. Fill this in and the admin will approve your card.</p>
    <label>Full name</label><input id="rn"><label>Designation</label><input id="rd">
    <button onclick="reqJoin()">Send request</button><button class="alt" onclick="sb.auth.signOut()">Log out</button>`;
    return;
  }
  if(me.status==='pending'){app.innerHTML=`<h1 style="font-size:22px">Waiting for approval</h1><p class="note">Your request has been sent. Once the admin approves it, your card will appear here.</p><button class="alt" onclick="sb.auth.signOut()">Log out</button>`;return;}
  if(me.is_admin)await loadTeam();
  render();
}
async function reqJoin(){const{error}=await sb.rpc('request_join',{n:$('rn').value.trim(),d:$('rd').value.trim()});if(error)return alert(error.message);load();}
async function loadTeam(){const{data}=await sb.from('team').select('*').order('name');team=(data||[]).filter(t=>t.status==='approved');pending=(data||[]).filter(t=>t.status==='pending');}
function render(){
  let h=me.is_admin?`<div><button class="${tab==='card'?'':'alt'}" onclick="tab='card';render()">My card</button><button class="${tab==='team'?'':'alt'}" onclick="tab='team';render()">Team (${team.length})</button></div>`:'';
  if(tab==='team'&&me.is_admin){
    if(pending.length)h+=`<h2>Waiting for approval (${pending.length})</h2>`+pending.map(t=>`<div class="m"><b>${esc(t.name)}</b><small>${esc(t.designation)} · ${esc(t.email)}</small>
    <button onclick="approve('${esc(t.email)}')">Approve</button><button class="alt" onclick="del('${esc(t.email)}')">Reject</button></div>`).join('');
    h+=`<h2>Add a person</h2><label>Work email</label><input id="ne"><label>Name</label><input id="nn"><label>Designation</label><input id="nd">
    <label>Type</label><select id="nt"><option>Full-time</option><option>Part-time</option><option>Casual</option></select><button onclick="addP()">Add</button><h2>Everyone</h2>`+
    team.map(t=>`<div class="m"><b>${esc(t.name||'(not filled yet)')}</b>${t.is_admin?'<span class="tag">Admin</span>':''} <button class="alt" onclick="tog('${esc(t.email)}',${!t.is_admin})">${t.is_admin?'Remove admin':'Make admin'}</button><small>${esc(t.designation)} · ${esc(t.type)} · ${esc(t.email)}</small>
    <button class="alt" onclick="editOther('${esc(t.email)}')">Edit</button><button class="alt" onclick="del('${esc(t.email)}')">Delete</button></div>`).join('');
  }else if(tab==='editOther'&&editTarget){
    const t=editTarget;
    h+=`<h1 style="font-size:22px">Edit ${esc(t.name||t.email)}</h1>
    <label>Full name</label><input id="on" value="${esc(t.name)}"><label>Designation</label><input id="od" value="${esc(t.designation)}">
    <label>Phone</label><input id="op" type="tel" value="${esc(t.phone)}"><label>Home address</label><input id="oa" value="${esc(t.address)}">
    <label>Employment type</label><select id="ot">${['Full-time','Part-time','Casual'].map(o=>`<option ${t.type===o?'selected':''}>${o}</option>`).join('')}</select>
    <button onclick="saveOther()">Save</button><button class="alt" onclick="tab='team';render()">Cancel</button>`;
  }else if(tab==='edit'){
    h+=`<h1 style="font-size:22px">Edit your card</h1><label>Photo</label><input type="file" accept="image/*" onchange="readPhoto(this,d=>{photoData=d;$('pv').src=d})">
    <img id="pv" class="ava" src="${me.photo||''}" style="${me.photo?'':'display:none'}">
    <label>Full name</label><input id="n" value="${esc(me.name)}"><label>Designation</label><input id="d" value="${esc(me.designation)}">
    <label>Phone</label><input id="p" type="tel" value="${esc(me.phone)}"><label>Home address</label><input id="a" value="${esc(me.address)}">
    <label>Employment type</label><select id="t">${['Full-time','Part-time','Casual'].map(o=>`<option ${me.type===o?'selected':''}>${o}</option>`).join('')}</select>
    <button onclick="save()">Save</button><button class="alt" onclick="tab='card';render()">Cancel</button>`;
  }else{
    h+=show(me)+`<button onclick="tab='edit';photoData=null;render()" class="alt">Edit</button><button onclick="saveVcf()">Save to Contacts</button>
    <button class="alt" onclick="navigator.clipboard.writeText('${link(me.slug)}');this.textContent='Link copied'">Copy my card link</button>
    <div class="qr">${qr(vcard(me,true))}<div class="note">Scan with a phone camera to save this contact</div></div><button class="alt" onclick="sb.auth.signOut()">Log out</button>`;
  }
  app.innerHTML=h;
}
async function save(){
  const{error}=await sb.rpc('save_card',{n:$('n').value.trim(),d:$('d').value.trim(),p:$('p').value.trim(),t:$('t').value,ph:photoData!==null?photoData:me.photo,ad:$('a').value.trim()});
  if(error)return alert(error.message);tab='card';load();
}
async function addP(){const e=$('ne').value.trim().toLowerCase();if(!e)return;const{error}=await sb.from('team').insert({email:e,name:$('nn').value.trim(),designation:$('nd').value.trim(),type:$('nt').value,status:'approved'});if(error)return alert(error.message);await loadTeam();render();}
async function tog(e,v){await sb.from('team').update({is_admin:v}).eq('email',e);await loadTeam();render();}
async function del(e){if(!confirm('Remove '+e+'?'))return;await sb.from('team').delete().eq('email',e);await loadTeam();render();}
async function approve(e){await sb.from('team').update({status:'approved'}).eq('email',e);await loadTeam();render();}
function editOther(e){editTarget=team.find(x=>x.email===e);tab='editOther';render();}
async function saveOther(){
  const{error}=await sb.from('team').update({name:$('on').value.trim(),designation:$('od').value.trim(),phone:$('op').value.trim(),address:$('oa').value.trim(),type:$('ot').value}).eq('email',editTarget.email);
  if(error)return alert(error.message);editTarget=null;tab='team';await loadTeam();render();
}
init();
</script></body></html>
